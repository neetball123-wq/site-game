<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="kd-ink" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2.2"/></filter>
    <filter id="kd-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
</svg>

<div id="app" class="app" data-season="0">
  <!-- 上の帯 -->
  <header class="bar">
    <p class="where"><b id="b-season">春</b><span id="b-fight">一の戦</span></p>
    <p class="zeni" title="銭"><i aria-hidden="true">銭</i><b id="b-zeni">0</b></p>
    <div class="bar-btns">
      <button type="button" class="ib" id="b-relic" aria-label="御守り"><span>守</span><em id="b-relic-n">0</em></button>
      <button type="button" class="ib" id="b-book" aria-label="言霊帖"><span>帖</span></button>
      <button type="button" class="ib" id="b-menu" aria-label="ほかの操作"><span>≡</span></button>
    </div>
  </header>

  <!-- 物の怪 -->
  <section class="foe" id="foe" aria-label="物の怪">
    <div class="foe-art" id="foe-art"></div>
    <div class="foe-txt">
      <h2 class="foe-name" id="foe-name"></h2>
      <p class="foe-weak" id="foe-weak"></p>
      <p class="foe-trick" id="foe-trick" hidden></p>
      <div class="gauge" id="gauge" role="meter" aria-label="祓い">
        <div class="gauge-bar"><i id="g-fill"></i><i id="g-ghost"></i></div>
        <p class="gauge-num"><b id="g-got">0</b><span>／</span><span id="g-target">0</span></p>
      </div>
    </div>
    <div class="left">
      <p class="left-row"><span>詠む</span><b id="l-plays"></b></p>
      <p class="left-row"><span>書き直し</span><b id="l-disc"></b></p>
      <p class="left-row"><span>手札</span><b id="l-hand"></b></p>
    </div>
  </section>

  <!-- 懐紙（ここに文を書く） -->
  <section class="paper-wrap">
    <div class="paper" id="paper" aria-live="polite"></div>
    <button type="button" class="br-btn" id="a-br" title="改行（Enter）">改行</button>
    <div class="cursor-bar" id="cursor-bar" hidden>
      <button type="button" id="cur-up" aria-label="前へ">前へ</button>
      <button type="button" id="cur-down" aria-label="後ろへ">後ろへ</button>
      <button type="button" id="cur-del" aria-label="もどす">もどす</button>
      <button type="button" id="cur-off" aria-label="選ぶのをやめる">✓</button>
    </div>
  </section>

  <!-- 判定 -->
  <section class="judge" id="judge" aria-live="polite">
    <p class="j-msg" id="j-msg"></p>
    <div class="j-waza" id="j-waza"></div>
    <p class="j-calc" id="j-calc"></p>
  </section>

  <!-- 助詞（何度でも使える） -->
  <section class="palette" id="palette" aria-label="助詞の札"></section>

  <!-- 手札 -->
  <section class="hand" id="hand" aria-label="手札"></section>

  <footer class="acts">
    <button type="button" class="act" id="a-disc">書き直し</button>
    <button type="button" class="act" id="a-tool">道具</button>
    <button type="button" class="act" id="a-clear">白紙</button>
    <button type="button" class="act main" id="a-play">詠む</button>
  </footer>

  <!-- 演出の層 -->
  <div class="fx" id="fx" aria-hidden="true"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
</div>

<!-- 重ねて出す画面 -->
<div class="ov" id="ov" hidden><div class="ov-in" id="ov-in" role="dialog" aria-modal="true"></div></div>
<div class="pop" id="pop" hidden></div>
