<body class="t-night">
<div class="app" id="app">

  <!-- タイトル -->
  <section class="scr on" id="title">
    <canvas class="t-sky" id="t-sky"></canvas>
    <div class="t-box">
      <canvas class="t-logo" id="t-logo" aria-label="ツブのとっておき"></canvas>
      <h1 class="vh">ツブのとっておき</h1>
      <p class="t-sub">ひと粒の光から生まれた、女の子の話</p>
      <div class="t-btns">
        <button type="button" class="btn big" id="t-new">はじめる</button>
        <button type="button" class="btn" id="t-cont" hidden>つづきから</button>
        <div class="t-row">
          <button type="button" class="btn sm" id="t-zukan">たからもの</button>
          <button type="button" class="btn sm" id="t-musubi">むすび</button>
        </div>
      </div>
      <p class="t-mark" id="t-mark"></p>
    </div>
    <p class="t-note">この作品はフィクションです。</p>
  </section>

  <!-- 育てる -->
  <section class="scr" id="game">
    <div class="stage">
      <div class="tin s1" id="tin">
        <div class="lid">
          <div class="lid-print"></div>
          <div class="view" id="view-box">
            <canvas id="view"></canvas>
            <p class="age" id="age"></p>
            <div class="season" id="season"></div>
            <div class="pocket" id="pocket" hidden><b id="pk-cap"></b><div class="pk-s" id="pk-s"></div></div>
          </div>
          <div class="say" id="say"><p id="say-t"></p><span class="say-next" id="say-next">▼</span></div>
        </div>
        <div class="box">
          <p class="box-cap" id="box-cap"></p>
          <div class="tray" id="tray"></div>
        </div>
      </div>
      <div class="acts" id="acts"></div>
    </div>
  </section>

  <!-- もち帰った物・できごと・旅立ち -->
  <div class="ov" id="ov" hidden>
    <div class="ov-in" id="ov-in"></div>
  </div>

  <!-- 物の説明 -->
  <div class="peek" id="peek" hidden>
    <div class="peek-card">
      <canvas id="peek-cv"></canvas>
      <p class="peek-n" id="peek-n"></p>
      <p class="peek-s" id="peek-s"></p>
      <div class="peek-b" id="peek-b"></div>
    </div>
  </div>

  <!-- 結末 -->
  <section class="scr" id="end">
    <div class="end-in">
      <canvas id="end-cv"></canvas>
      <div class="end-txt" id="end-txt"></div>
      <div class="end-b" id="end-b"></div>
    </div>
  </section>

  <!-- たからもの・むすび -->
  <section class="scr" id="book">
    <div class="book-in">
      <h2 class="book-h" id="book-h"></h2>
      <p class="book-p" id="book-p"></p>
      <div class="book-grid" id="book-grid"></div>
      <p class="book-d" id="book-d"></p>
      <button type="button" class="btn" id="book-back">もどる</button>
    </div>
  </section>

  <div class="ask" id="ask" hidden><div class="ask-in"><p id="ask-t"></p><div class="ask-b" id="ask-b"></div></div></div>
  <button type="button" class="snd" id="snd" aria-label="音">♪</button>
</div>
